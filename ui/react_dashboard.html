<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGARevion + MedStreamMem | Memory Optimization & Accuracy Benchmark</title>
  <!-- Tailwind CSS -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <!-- React 18 and ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <!-- Google Fonts: Inter and JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React ErrorBoundary:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center text-rose-400 bg-slate-950 min-h-screen flex flex-col items-center justify-center space-y-4">
              <h2 className="text-xl font-bold">⚠️ Dashboard Rendering Error</h2>
              <p className="text-xs text-slate-400 max-w-md">{String(this.state.error?.message)}</p>
              <button onClick={() => window.location.reload()} className="px-4 py-2 bg-teal-600 text-white text-xs font-bold rounded-lg shadow-lg">Reload Dashboard</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const CLINICAL_PRESETS = [
      {
        title: "WHO Bacterial Meningitis Protocol",
        query: "What is the immediate empirical pharmacotherapy for suspected acute bacterial meningitis in adults?\nA: Oral Amoxicillin\nB: IV Ceftriaxone 2g with Dexamethasone\nC: Acetaminophen alone\nD: Hydrochlorothiazide",
        trust: 0.95,
        type: "Guideline",
        ground_truth: "B"
      },
      {
        title: "ADA Type 2 Diabetes Guideline",
        query: "What is the recommended first-line pharmacological treatment for newly diagnosed Type 2 Diabetes?\nA: Insulin glargine\nB: Metformin combined with lifestyle intervention\nC: Sulfonylurea monotherapy\nD: Furosemide",
        trust: 0.95,
        type: "Guideline",
        ground_truth: "B"
      },
      {
        title: "AHA Acute Coronary Syndrome Protocol",
        query: "For an acute STEMI patient undergoing primary PCI, what antiplatelet therapy is indicated?\nA: Aspirin monotherapy\nB: Dual Antiplatelet Therapy (Aspirin + P2Y12 inhibitor)\nC: Warfarin alone\nD: Heparin without antiplatelets",
        trust: 0.95,
        type: "Guideline",
        ground_truth: "B"
      },
      {
        title: "Unverified Forum Symptom Noise",
        query: "Can raw crushed garlic directly cure bacterial pneumonia within 24 hours?\nA: Yes, it replaces all antibiotics\nB: No, pneumonia requires validated clinical antimicrobial therapy\nC: Only when taken with hot tea\nD: Yes, through lung detox",
        trust: 0.50,
        type: "Noise",
        ground_truth: "B"
      },
      {
        title: "Pericardium Gene Expression (Incorrect Test)",
        query: "Which genes or proteins are expressed exclusively in the pericardium and not in either the dorsal or ventral regions of the thalamus?\nA: ADH1A\nB: ADH1C\nC: ADH4\nD: ADH1B",
        trust: 0.95,
        type: "Incorrect",
        ground_truth: "D"
      }
    ];

    function App() {
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'assistant',
          text: 'Welcome to KGARevion + MedStreamMem workbench. This system evaluates Option B: Domain-Weighted Fusion (Frequency + Recency + Trust) bounded memory against unbounded and standard LRU/LFU baselines.',
          timestamp: new Date().toLocaleTimeString(),
          meta: null
        }
      ]);
      const [inputQuery, setInputQuery] = useState('');
      const [inputTrust, setInputTrust] = useState(0.95);
      const [loading, setLoading] = useState(false);
      const [activeTab, setActiveTab] = useState('chat'); // 'chat', 'telemetry', 'benchmark', 'heatmap'
      const [memoryData, setMemoryData] = useState({
        name: 'MedStreamMem',
        capacity: 50,
        current_size: 0,
        current_step: 0,
        total_lookups: 0,
        cache_hits: 0,
        cache_misses: 0,
        cache_hit_ratio_pct: 0.0,
        high_trust_retention_pct: 88.0,
        average_latency_sec: 0.001,
        memory_usage_mb: 42.5,
        total_evictions: 0,
        entries: [],
        eviction_history: [],
        comparison: {
          ram_before_mb: 850.0,
          ram_optimized_mb: 42.5,
          memory_reduction_pct: 95.0,
          accuracy_pct: 82.5,
          precision_pct: 84.2,
          recall_pct: 81.0,
          f1_score_pct: 82.6,
          high_trust_retention_pct: 88.0,
          cache_hit_ratio_pct: 45.0,
          average_latency_sec: 0.001
        }
      });
      const [benchmarkData, setBenchmarkData] = useState([]);
      const [summaryData, setSummaryData] = useState([]);
      const chatEndRef = useRef(null);

      const fetchMemory = async () => {
        try {
          const res = await fetch('/api/memory');
          if (res.ok) {
            const data = await res.json();
            setMemoryData(prev => ({ ...prev, ...data }));
          }
        } catch (err) {
          console.warn("Memory fetch:", err);
        }
      };

      const fetchBenchmark = async () => {
        try {
          const res = await fetch('/api/benchmark');
          if (res.ok) {
            const data = await res.json();
            setBenchmarkData(Array.isArray(data) ? data : (data.raw_benchmark_runs || data.baselines || []));
          }
        } catch (err) {
          console.warn("Benchmark fetch:", err);
        }
      };

      const fetchSummary = async () => {
        try {
          const res = await fetch('/api/benchmark/summary');
          if (res.ok) {
            const data = await res.json();
            setSummaryData(data);
          }
        } catch (err) {
          console.warn("Summary fetch:", err);
        }
      };

      useEffect(() => {
        fetchMemory();
        fetchBenchmark();
        fetchSummary();
        const interval = setInterval(() => {
          fetchMemory();
          fetchSummary();
        }, 4000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        if (activeTab === 'chat') {
          chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }
      }, [messages, loading, activeTab]);

      const handleSend = async (queryText, trustOverride, gtOverride) => {
        const text = queryText || inputQuery;
        if (!text || !text.trim() || loading) return;

        const trust = trustOverride !== undefined ? trustOverride : inputTrust;
        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text: text,
          trust: trust,
          timestamp: new Date().toLocaleTimeString()
        };

        setMessages(prev => [...prev, userMsg]);
        setInputQuery('');
        setLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: text, trust: trust, ground_truth: gtOverride || '' })
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          const assistantMsg = {
            id: Date.now() + 1,
            sender: 'assistant',
            text: typeof data.answer === 'string' ? data.answer : JSON.stringify(data.answer),
            timestamp: new Date().toLocaleTimeString(),
            meta: data
          };

          setMessages(prev => [...prev, assistantMsg]);
          if (data.memory) {
            setMemoryData(prev => ({ ...prev, ...data.memory }));
          } else {
            fetchMemory();
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            id: Date.now() + 1,
            sender: 'assistant',
            text: `Connection error: ${err.message}. Make sure server.py is running.`,
            timestamp: new Date().toLocaleTimeString(),
            error: true
          }]);
        } finally {
          setLoading(false);
        }
      };

      const handleSwitchMemory = async (type) => {
        try {
          const res = await fetch('/api/memory/switch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ type: type, capacity: memoryData.capacity || 50 })
          });
          if (res.ok) {
            fetchMemory();
          }
        } catch (e) {
          alert("Switch error: " + e.message);
        }
      };

      const handleClear = async () => {
        if (!confirm("Reset memory buffer?")) return;
        try {
          await fetch('/api/memory/clear', { method: 'POST' });
          fetchMemory();
        } catch (e) {
          alert("Clear error: " + e.message);
        }
      };
      return (
        <div className="flex flex-col h-screen max-h-screen overflow-hidden bg-slate-950 text-slate-100">

          {/* Top Header Bar */}
          <header className="bg-slate-900 border-b border-slate-800 px-6 py-2.5 flex flex-wrap justify-between items-center shadow-lg z-20">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 via-emerald-400 to-cyan-400 flex items-center justify-center font-bold text-slate-950 text-base shadow-md">
                ⚡
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-base font-bold text-white tracking-tight">KGARevion + MedStreamMem</h1>
                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-teal-500/20 text-teal-300 border border-teal-500/30">
                    Option B: Domain-Weighted Fusion
                  </span>
                </div>
                <p className="text-xs text-slate-400">
                  Active Baseline: <b className="text-teal-400 font-mono">{memoryData.name || 'MedStreamMem'}</b> | Capacity: <b className="text-amber-300 font-mono">{memoryData.capacity || 50}</b>
                </p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="flex items-center gap-2 mt-2 sm:mt-0">
              <div className="flex bg-slate-950 border border-slate-800 rounded-xl p-1 text-xs shadow-inner">
                <button
                  onClick={() => setActiveTab('chat')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 ${activeTab === 'chat' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                  <span>💬 Chat</span>
                </button>
                <button
                  onClick={() => setActiveTab('telemetry')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 ${activeTab === 'telemetry' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                  <span>🧠 Buffer</span>
                  <span className="bg-slate-800 text-amber-300 text-[10px] px-1.5 py-0.5 rounded-full border border-slate-700">
                    {memoryData.entries ? memoryData.entries.length : 0}/{memoryData.capacity || 50}
                  </span>
                </button>
                <button
                  onClick={() => setActiveTab('benchmark')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 ${activeTab === 'benchmark' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                  <span>📊 Benchmark</span>
                </button>
                <button
                  onClick={() => setActiveTab('heatmap')}
                  className={`px-3 py-1.5 rounded-lg font-medium transition flex items-center gap-1.5 ${activeTab === 'heatmap' ? 'bg-teal-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'}`}>
                  <span>🔥 Priority Heatmap</span>
                </button>
              </div>

              <button
                onClick={handleClear}
                className="text-xs px-2.5 py-1.5 bg-slate-800 hover:bg-rose-950 text-slate-300 hover:text-rose-300 border border-slate-700 hover:border-rose-700 rounded-lg transition shadow">
                🗑️ Clear
              </button>
            </div>
          </header>

          {/* Formula Strip */}
          <div className="bg-slate-900 border-b border-slate-800 px-6 py-1.5 flex flex-wrap justify-between items-center text-[11px] text-slate-400">
            <div className="flex items-center gap-2">
              <span className="font-semibold text-slate-300">Option B Formula:</span>
              <span className="font-mono bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-amber-300 font-bold">
                Priority Score = (&phi;<sub>hits</sub> &times; &tau;<sub>trust</sub>) / (&Delta;t + 1.0)
              </span>
              <span className="hidden md:inline text-slate-500">Dynamic clinical hierarchy (&tau; &isin; [0.35, 0.98]) protects high-authority guidelines from noise eviction.</span>
            </div>
            <div className="font-mono text-slate-400">
              Tick: <b className="text-teal-400">{memoryData.current_step || 0}</b> | Lookups: <b className="text-slate-200">{memoryData.total_lookups || 0}</b> | Hits: <b className="text-emerald-400">{memoryData.cache_hits || 0}</b> | Evictions: <b className="text-rose-400">{memoryData.total_evictions || 0}</b>
            </div>
          </div>

          {/* Main Body Tabs */}
          <div className="flex-1 flex overflow-hidden">

            {/* TAB 1: INTERACTIVE CHAT */}
            {activeTab === 'chat' && (
              <div className="flex-1 flex flex-col lg:flex-row overflow-hidden w-full">
                
                {/* Chat Column */}
                <div className="flex-1 flex flex-col h-full bg-slate-950 overflow-hidden border-r border-slate-800">
                  <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                    {messages.map((msg) => (
                      <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                        <div className="text-[10px] text-slate-500 mb-1 px-1 flex items-center gap-1.5">
                          <span>{msg.sender === 'user' ? 'Clinical User' : 'KGARevion Agent'}</span>
                          <span>•</span>
                          <span>{msg.timestamp}</span>
                          {msg.trust !== undefined && (
                            <span className="px-1.5 py-0.2 bg-slate-800 text-amber-300 font-mono rounded text-[9px]">
                              &tau;={msg.trust}
                            </span>
                          )}
                        </div>

                        <div className={`max-w-2xl rounded-2xl p-4 text-sm shadow-md leading-relaxed ${
                          msg.sender === 'user'
                            ? 'bg-gradient-to-br from-teal-600 to-teal-700 text-white rounded-tr-none'
                            : 'bg-slate-900 border border-slate-800 text-slate-100 rounded-tl-none'
                        }`}>
                          <div className="whitespace-pre-wrap">{msg.text}</div>

                          {msg.meta && (
                            <div className="mt-3 pt-3 border-t border-slate-800 text-xs space-y-2">
                              <div className="flex items-center justify-between">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold font-mono ${msg.meta.cache_hit ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-sky-500/20 text-sky-300 border border-sky-500/30'}`}>
                                  {msg.meta.cache_hit ? '⚡ MEDSTREAMMEM CACHE HIT (0.001s)' : '🔍 MEDSTREAMMEM CACHE MISS (Pipeline Executed)'}
                                </span>
                                {msg.meta.new_eviction && (
                                  <span className="px-2 py-0.5 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded text-[10px] font-bold">
                                    🚨 BOUNDED EVICTION EXECUTED
                                  </span>
                                )}
                              </div>

                              {renderTriplets(msg.meta.filtered_triplets)}
                              {renderSingleMetrics(msg.meta.single_question_metrics)}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}

                    {loading && (
                      <div className="flex items-center gap-3 p-4 bg-slate-900/80 border border-slate-800 rounded-2xl text-xs text-teal-300 max-w-sm animate-pulse">
                        <div className="w-4 h-4 border-2 border-teal-400 border-t-transparent rounded-full animate-spin"></div>
                        <span>Processing clinical query via KGARevion & MedStreamMem...</span>
                      </div>
                    )}

                    <div ref={chatEndRef} />
                  </div>

                  {/* Preset Query Strip */}
                  <div className="px-4 py-2 bg-slate-900/90 border-t border-slate-800 flex items-center gap-2 overflow-x-auto text-xs">
                    <span className="text-slate-400 font-semibold whitespace-nowrap text-[11px]">Clinical Presets:</span>
                    {CLINICAL_PRESETS.map((p, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleSend(p.query, p.trust, p.ground_truth)}
                        disabled={loading}
                        className={`whitespace-nowrap px-2.5 py-1 rounded-lg text-[11px] font-medium transition border flex items-center gap-1.5 ${
                          p.type === 'Guideline'
                            ? 'bg-amber-950/30 hover:bg-amber-900/50 text-amber-300 border-amber-800/40'
                            : p.type === 'Incorrect'
                            ? 'bg-rose-950/50 hover:bg-rose-900/70 text-rose-300 border-rose-700/60'
                            : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'
                        }`}>
                        <span>{p.type === 'Guideline' ? '🛡️' : p.type === 'Incorrect' ? '❌' : '⚠️'}</span>
                        <span>{p.title}</span>
                      </button>
                    ))}
                  </div>

                  {/* Input Form */}
                  <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} className="p-4 bg-slate-900 border-t border-slate-800 flex gap-3 items-center">
                    <div className="flex items-center gap-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs">
                      <span className="text-slate-400">&tau; Trust:</span>
                      <select
                        value={inputTrust}
                        onChange={(e) => setInputTrust(parseFloat(e.target.value))}
                        className="bg-transparent text-amber-300 font-mono font-bold focus:outline-none">
                        <option value="0.95" className="bg-slate-900 text-amber-300">0.95 (Verified Guideline)</option>
                        <option value="0.80" className="bg-slate-900 text-teal-300">0.80 (Peer Reviewed)</option>
                        <option value="0.50" className="bg-slate-900 text-slate-300">0.50 (Unverified Forum)</option>
                        <option value="0.20" className="bg-slate-900 text-rose-300">0.20 (Known Noise)</option>
                      </select>
                    </div>

                    <input
                      type="text"
                      value={inputQuery}
                      onChange={(e) => setInputQuery(e.target.value)}
                      placeholder="Type a clinical MCQ question or medical inquiry..."
                      disabled={loading}
                      className="flex-1 bg-slate-950 border border-slate-800 focus:border-teal-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-teal-500 transition font-sans"
                    />

                    <button
                      type="submit"
                      disabled={loading || !inputQuery.trim()}
                      className="px-5 py-3 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 disabled:from-slate-800 disabled:to-slate-800 text-white font-medium rounded-xl text-sm transition shadow-md flex items-center gap-2">
                      <span>Send</span>
                      <span>➔</span>
                    </button>
                  </form>
                </div>

                {/* Right Sidebar: Quick Live Telemetry */}
                <div className="w-full lg:w-96 bg-slate-900/90 p-4 border-l border-slate-800 overflow-y-auto space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="font-bold text-slate-200 text-sm flex items-center gap-1.5">
                      <span>🧠 MedStreamMem Live Buffer</span>
                    </h2>
                    <span className="text-xs bg-teal-950 text-teal-300 px-2 py-0.5 rounded border border-teal-800/80 font-mono">
                      {memoryData.entries ? memoryData.entries.length : 0} / {memoryData.capacity || 50}
                    </span>
                  </div>

                  <MemoryTableView entries={memoryData.entries || []} maxItems={8} />
                  <EvictionFeedView evictions={memoryData.eviction_history || []} maxItems={4} />
                </div>

              </div>
            )}

            {/* TAB 2: FULL MEMORY BUFFER & TELEMETRY */}
            {activeTab === 'telemetry' && (
              <div className="flex-1 p-6 overflow-y-auto bg-slate-950 space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-xl font-bold text-teal-400">MedStreamMem Buffer & Priority Scores</h2>
                    <p className="text-xs text-slate-400">All current entries sorted by Priority Score descending. Lowest score will be evicted next.</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-slate-400">Switch Baseline:</span>
                    <button onClick={() => handleSwitchMemory('medstreammem')} className={`px-2.5 py-1 text-xs rounded-lg border font-mono ${memoryData.name === 'MedStreamMem' ? 'bg-teal-600 border-teal-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>MedStreamMem</button>
                    <button onClick={() => handleSwitchMemory('lru')} className={`px-2.5 py-1 text-xs rounded-lg border font-mono ${memoryData.name === 'LRUMemory' ? 'bg-teal-600 border-teal-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>LRU</button>
                    <button onClick={() => handleSwitchMemory('lfu')} className={`px-2.5 py-1 text-xs rounded-lg border font-mono ${memoryData.name === 'LFUMemory' ? 'bg-teal-600 border-teal-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>LFU</button>
                    <button onClick={() => handleSwitchMemory('unbounded')} className={`px-2.5 py-1 text-xs rounded-lg border font-mono ${memoryData.name === 'UnboundedMemory' ? 'bg-teal-600 border-teal-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-300'}`}>Unbounded</button>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                  <MemoryTableView entries={memoryData.entries || []} expanded={true} />
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                  <h3 className="text-base font-bold text-rose-400 mb-3">Eviction History Log</h3>
                  <EvictionFeedView evictions={memoryData.eviction_history || []} expanded={true} />
                </div>
              </div>
            )}

            {/* TAB 3: COMPARATIVE BENCHMARK SUITE */}
            {activeTab === 'benchmark' && (
              <div className="flex-1 p-6 overflow-y-auto bg-slate-950 space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-xl font-bold text-teal-400">Before vs. After Memory Optimization & Multi-Model Benchmark</h2>
                    <p className="text-xs text-slate-400">Comparative dataset evaluations across LLaMA-3.2, Qwen-2.5, and DeepSeek, computing all 11 metrics with publication visualizations.</p>
                  </div>
                  <button onClick={() => { fetchBenchmark(); fetchSummary(); }} className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-teal-300 text-xs font-mono font-bold rounded-lg border border-slate-700 flex items-center gap-1.5 transition">
                    <span>🔄 Refresh Benchmark Data</span>

          <div className="grid grid-cols-4 gap-2 text-center font-mono">
            <div className={`p-2 rounded-lg border ${hasGt && !m.is_correct ? 'bg-rose-950/20 border-rose-900/40' : 'bg-slate-900/90 border-slate-800'}`}>
              <div className="text-[10px] text-slate-400">Accuracy</div>
              <div className={`text-sm font-bold ${hasGt ? (m.is_correct ? 'text-teal-300' : 'text-rose-400') : 'text-slate-400'}`}>{hasGt ? `${m.accuracy_pct.toFixed(1)}%` : 'N/A'}</div>
            </div>
            <div className={`p-2 rounded-lg border ${hasGt && !m.is_correct ? 'bg-rose-950/20 border-rose-900/40' : 'bg-slate-900/90 border-slate-800'}`}>
              <div className="text-[10px] text-slate-400">Precision</div>
              <div className={`text-sm font-bold ${hasGt ? (m.is_correct ? 'text-emerald-400' : 'text-rose-400') : 'text-slate-400'}`}>{hasGt ? `${m.precision_pct.toFixed(1)}%` : 'N/A'}</div>
            </div>
            <div className={`p-2 rounded-lg border ${hasGt && !m.is_correct ? 'bg-rose-950/20 border-rose-900/40' : 'bg-slate-900/90 border-slate-800'}`}>
              <div className="text-[10px] text-slate-400">Recall</div>
              <div className={`text-sm font-bold ${hasGt ? (m.is_correct ? 'text-amber-400' : 'text-rose-400') : 'text-slate-400'}`}>{hasGt ? `${m.recall_pct.toFixed(1)}%` : 'N/A'}</div>
            </div>
            <div className={`p-2 rounded-lg border ${hasGt && !m.is_correct ? 'bg-rose-950/20 border-rose-900/40' : 'bg-slate-900/90 border-slate-800'}`}>
              <div className="text-[10px] text-slate-400">F1-Score</div>
              <div className={`text-sm font-bold ${hasGt ? (m.is_correct ? 'text-indigo-400' : 'text-rose-400') : 'text-slate-400'}`}>{hasGt ? `${m.f1_score_pct.toFixed(1)}%` : 'N/A'}</div>
            </div>
          </div>

          {/* Memory Reduction & Priority Score */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs font-mono">
            <div className="bg-slate-900/90 p-2 rounded-lg border border-slate-800 flex items-center justify-between">
              <span className="text-slate-400 text-[11px]">RAM Footprint:</span>
              <span className="text-emerald-400 font-bold">{m.ram_before_mb}MB → {m.ram_optimized_mb}MB <span className="text-teal-300 font-normal">({m.memory_reduction_pct}% Saved)</span></span>
            </div>
            <div className="bg-slate-900/90 p-2 rounded-lg border border-slate-800 flex items-center justify-between">
              <span className="text-slate-400 text-[11px]">Priority S<sub>i</sub>:</span>
              <span className="text-amber-300 font-bold">{m.priority_score} <span className="text-[10px] text-slate-400">({m.phi_hits} hits, &tau;={m.tau_trust})</span></span>
            </div>
          </div>

          {/* Question Subgraph Compression Strip */}
          {m.triplets_generated > 0 && (
            <div className="bg-slate-900/70 px-2.5 py-1.5 rounded-lg border border-slate-800/80 text-[11px] font-mono flex items-center justify-between text-slate-300">
              <span className="text-slate-400">Knowledge Graph Pruning:</span>
              <span className="font-semibold text-teal-300">
                {m.triplets_generated} candidates → <b className="text-emerald-300">{m.triplets_verified} verified</b> <span className="text-amber-300">({m.graph_compression_pct}% pruned)</span>
              </span>
            </div>
          )}
        </div>
      );
    }

    function MemoryTableView({ entries, maxItems, expanded }) {
      if (!entries || entries.length === 0) {
        return (
          <div className="p-6 bg-slate-950 border border-slate-800/80 rounded-xl text-center text-slate-500 text-xs italic">
            Memory buffer empty. Type queries in chat.
          </div>
        );
      }

      const displayList = expanded || !maxItems ? entries : entries.slice(0, maxItems);

      return (
        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs text-slate-300 border-collapse">
            <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] border-b border-slate-800">
              <tr>
                <th className="p-2">Rank</th>
                <th className="p-2">Query Key</th>
                <th className="p-2 text-center">&phi;<sub>hits</sub></th>
                <th className="p-2 text-center">&tau;<sub>trust</sub></th>
                <th className="p-2 text-center">&Delta;t</th>
                <th className="p-2 text-right">Priority</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-800/60 font-sans">
              {displayList.map((item, idx) => {
                const tVal = typeof item.trust === 'number' ? item.trust : (parseFloat(item.trust) || 0.95);
                const tTier = tVal >= 0.90 ? '🛡️ Guideline'
                  : tVal >= 0.80 ? '📚 Peer-Reviewed'
                  : tVal >= 0.65 ? '📋 Clinical Protocol'
                  : tVal >= 0.50 ? '💬 Forum Discussion'
                  : '⚠️ Patient Noise';
                const tBadgeClass = tVal >= 0.90 ? 'bg-amber-500/20 text-amber-300 border-amber-500/40'
                  : tVal >= 0.80 ? 'bg-teal-500/20 text-teal-300 border-teal-500/40'
                  : tVal >= 0.65 ? 'bg-sky-500/20 text-sky-300 border-sky-500/40'
                  : tVal >= 0.50 ? 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40'
                  : 'bg-rose-500/20 text-rose-300 border-rose-500/40';

                return (
                  <tr key={idx} className="hover:bg-slate-800/40 transition">
                    <td className="p-2 font-mono font-bold text-teal-400">#{idx + 1}</td>
                    <td className="p-2 max-w-[150px] truncate text-slate-200" title={item.key}>{item.key}</td>
                    <td className="p-2 text-center font-mono font-bold text-teal-300">{item.hits}</td>
                    <td className="p-2 text-center">
                      <span className={`inline-block px-1.5 py-0.5 rounded border text-[11px] font-mono font-bold ${tBadgeClass}`} title={`${tTier} (τ=${tVal.toFixed(2)})`}>
                        {tVal.toFixed(2)}
                      </span>
                    </td>
                    <td className="p-2 text-center font-mono text-sky-300">{item.delta_t}</td>
                    <td className="p-2 text-right font-mono font-bold text-emerald-400">
                      {typeof item.priority_score === 'number' ? item.priority_score.toFixed(3) : item.priority_score}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    function EvictionFeedView({ evictions, maxItems, expanded }) {
      if (!evictions || evictions.length === 0) {
        return (
          <div className="p-4 bg-slate-950 border border-slate-800/60 rounded-xl text-center text-slate-500 text-xs italic">
            No evictions yet. Buffer has capacity.
          </div>
        );
      }

      const list = expanded || !maxItems ? evictions : evictions.slice(-maxItems);

      return (
        <div className="space-y-2">
          {list.slice().reverse().map((ev, idx) => (
            <div key={idx} className="p-2.5 bg-rose-950/20 border border-rose-900/40 rounded-lg text-xs space-y-1">
              <div className="flex justify-between font-semibold text-rose-300">
                <span className="truncate max-w-[180px]" title={ev.evicted_key}>Evicted: {ev.evicted_key}</span>
                <span className="font-mono text-amber-300 text-[10px]">Score: {ev.evicted_score}</span>
              </div>
              <div className="text-[10px] text-slate-400 flex justify-between font-mono">
                <span>&phi;: {ev.hits} | &tau;: {ev.trust} | &Delta;t: {ev.delta_t}</span>
                <span>Step: {ev.step}</span>
              </div>
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
