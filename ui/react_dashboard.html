<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGARevion React Workbench & MedStreamMem Telemetry</title>
  <!-- Tailwind CSS -->
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <!-- React 18 and ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased overflow-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, Component } = React;

    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("React ErrorBoundary caught error:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="p-8 text-center text-rose-400 bg-slate-900 min-h-screen flex flex-col items-center justify-center space-y-4">
              <h2 className="text-xl font-bold">⚠️ Rendering Error Encountered</h2>
              <p className="text-xs text-slate-400 max-w-md">{String(this.state.error && this.state.error.message)}</p>
              <button onClick={() => window.location.reload()} className="px-4 py-2 bg-teal-600 text-white text-xs font-bold rounded-lg">Reload App</button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const SAMPLE_QUERIES = [
      "Patient presents with high fever, neck stiffness, and confusion. What is the diagnosis?",
      "What are the primary interactions between Lisinopril and Potassium supplements?",
      "Explain the mechanism of action of Metformin in type 2 diabetes.",
      "A 45-year-old male has acute chest pain radiating to left arm. What immediate steps should be taken?"
    ];

    function renderTriplets(tripletsData) {
      if (!tripletsData) return null;
      let list = [];

      if (Array.isArray(tripletsData)) {
        list = tripletsData;
      } else if (typeof tripletsData === 'string') {
        try {
          const parsed = JSON.parse(tripletsData.replace(/'/g, '"'));
          if (Array.isArray(parsed)) list = parsed;
          else list = [tripletsData];
        } catch (e) {
          list = [tripletsData];
        }
      } else {
        list = [String(tripletsData)];
      }

      if (!list || list.length === 0) return null;

      return (
        <div className="mt-2">
          <b className="text-amber-400">Verified Knowledge Triplets:</b>
          <div className="mt-1 flex flex-wrap gap-1.5">
            {list.map((t, idx) => (
              <span key={idx} className="bg-slate-950 px-2 py-1 rounded border border-slate-700 font-mono text-[11px] text-amber-200">
                {Array.isArray(t) ? `(${t.join(' • ')})` : String(t)}
              </span>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'assistant',
          text: 'Hello! I am KGARevion, powered by local Llama 3.2:3b and MedStreamMem Bounded Memory. Ask me any medical query or diagnostic question below!',
          timestamp: new Date().toLocaleTimeString(),
          meta: null
        }
      ]);
      const [inputQuery, setInputQuery] = useState('');
      const [loading, setLoading] = useState(false);
      const [memoryData, setMemoryData] = useState({ capacity: 5, current_size: 0, current_step: 0, entries: [], eviction_history: [] });
      const [activeTab, setActiveTab] = useState('chat');
      const chatEndRef = useRef(null);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, loading]);

      const fetchMemory = async () => {
        try {
          const res = await fetch('/api/memory');
          if (res.ok) {
            const data = await res.json();
            setMemoryData(data);
          }
        } catch (err) {
          console.warn('Memory fetch error:', err);
        }
      };

      useEffect(() => {
        fetchMemory();
        const interval = setInterval(fetchMemory, 2500);
        return () => clearInterval(interval);
      }, []);

      const handleSend = async (queryText) => {
        const text = queryText || inputQuery;
        if (!text || !text.trim() || loading) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text: text,
          timestamp: new Date().toLocaleTimeString()
        };

        setMessages(prev => [...prev, userMsg]);
        setInputQuery('');
        setLoading(true);

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: text, trust: 0.95 })
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          const assistantMsg = {
            id: Date.now() + 1,
            sender: 'assistant',
            text: typeof data.answer === 'string' ? data.answer : JSON.stringify(data.answer),
            timestamp: new Date().toLocaleTimeString(),
            meta: data
          };

          setMessages(prev => [...prev, assistantMsg]);
          if (data.memory) {
            setMemoryData(data.memory);
          } else {
            fetchMemory();
          }
        } catch (err) {
          setMessages(prev => [...prev, {
            id: Date.now() + 1,
            sender: 'assistant',
            text: `Connection error: ${err.message}. Make sure server.py is running.`,
            timestamp: new Date().toLocaleTimeString(),
            error: true
          }]);
        } finally {
          setLoading(false);
        }
      };

      const handleClearMemory = async () => {
        if (!confirm("Reset MedStreamMem buffer?")) return;
        try {
          const res = await fetch('/api/memory/clear', { method: 'POST' });
          if (res.ok) {
            fetchMemory();
          }
        } catch (err) {
          alert("Error: " + err.message);
        }
      };

      return (
        <div className="flex flex-col h-screen max-h-screen overflow-hidden">
          
          {/* Header */}
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-3 flex flex-wrap justify-between items-center shadow-md">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center font-bold text-slate-950 text-lg shadow">
                🧬
              </div>
              <div>
                <h1 className="text-lg font-bold text-slate-100 leading-tight">KGARevion React Workbench</h1>
                <p className="text-xs text-slate-400">Model: <b className="text-teal-400">Ollama Llama 3.2:3b</b> | Bounded Memory: <b className="text-amber-300">MedStreamMem</b></p>
              </div>
            </div>

            <div className="flex items-center gap-3 mt-2 sm:mt-0">
              <div className="flex bg-slate-900 border border-slate-700 rounded-lg p-1 text-xs">
                <button 
                  onClick={() => setActiveTab('chat')} 
                  className={`px-3 py-1.5 rounded-md font-medium transition ${activeTab === 'chat' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                  💬 Interactive Chat
                </button>
                <button 
                  onClick={() => setActiveTab('memory')} 
                  className={`px-3 py-1.5 rounded-md font-medium transition flex items-center gap-1.5 ${activeTab === 'memory' ? 'bg-teal-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'}`}>
                  <span>🧠 Memory Telemetry</span>
                  <span className="bg-slate-800 text-amber-300 text-[10px] px-1.5 py-0.5 rounded-full border border-slate-700">
                    {memoryData.entries ? memoryData.entries.length : 0}/{memoryData.capacity || 5}
                  </span>
                </button>
              </div>

              <button 
                onClick={handleClearMemory} 
                className="text-xs px-3 py-1.5 bg-slate-700/80 hover:bg-rose-900/60 text-slate-300 hover:text-rose-300 border border-slate-600 hover:border-rose-700 rounded-lg transition">
                🗑️ Clear Buffer
              </button>
            </div>
          </header>

          {/* Formula Banner */}
          <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-teal-950 border-b border-teal-800/40 px-6 py-2.5 flex flex-wrap justify-between items-center text-xs">
            <div className="flex items-center gap-2">
              <span className="px-2 py-0.5 bg-amber-500/20 text-amber-300 font-mono font-bold rounded border border-amber-500/30">
                Priority Score = ( &phi;<sub>hits</sub> &times; &tau;<sub>trust</sub> ) / ( &Delta;t + 1.0 )
              </span>
              <span className="hidden md:inline text-slate-400">| Bounded Eviction: Lowest Priority Score item is evicted when capacity ({memoryData.capacity || 5}) is reached.</span>
            </div>
            <div className="text-slate-400 font-mono">
              Step Tick: <b className="text-teal-300">{memoryData.current_step || 0}</b> | Total Evictions: <b className="text-rose-400">{memoryData.total_evictions || 0}</b>
            </div>
          </div>

          {/* Workspace */}
          <div className="flex-1 flex overflow-hidden">
            {activeTab === 'chat' && (
              <div className="flex-1 flex flex-col lg:flex-row overflow-hidden w-full">
                
                {/* Chat Feed */}
                <div className="flex-1 flex flex-col h-full bg-slate-900 overflow-hidden border-r border-slate-800">
                  <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                    {messages.map((msg) => (
                      <div key={msg.id} className={`flex flex-col ${msg.sender === 'user' ? 'items-end' : 'items-start'}`}>
                        <div className="text-[10px] text-slate-500 mb-1 px-1">
                          {msg.sender === 'user' ? 'You' : 'KGARevion Agent'} • {msg.timestamp}
                        </div>
                        
                        <div className={`max-w-2xl rounded-2xl p-4 text-sm shadow-md leading-relaxed ${
                          msg.sender === 'user' 
                            ? 'bg-teal-600 text-white rounded-tr-none' 
                            : 'bg-slate-800 border border-slate-700 text-slate-100 rounded-tl-none'
                        }`}>
                          <div className="whitespace-pre-wrap">{msg.text}</div>

                          {msg.meta && (
                            <div className="mt-3 pt-3 border-t border-slate-700/80 text-xs space-y-2">
                              <div className="flex items-center justify-between">
                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold font-mono ${msg.meta.cache_hit ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-sky-500/20 text-sky-300 border border-sky-500/30'}`}>
                                  {msg.meta.cache_hit ? '⚡ MEDSTREAMMEM CACHE HIT' : '🔍 MEDSTREAMMEM CACHE MISS (Pipeline Ran)'}
                                </span>
                                {msg.meta.new_eviction && (
                                  <span className="px-2 py-0.5 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded text-[10px] font-bold">
                                    🚨 EVICTION OCCURRED
                                  </span>
                                )}
                              </div>

                              {renderTriplets(msg.meta.filtered_triplets)}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}

                    {loading && (
                      <div className="flex items-center gap-3 p-4 bg-slate-800/60 border border-slate-700/60 rounded-2xl text-xs text-teal-300 max-w-sm animate-pulse">
                        <div className="w-4 h-4 border-2 border-teal-400 border-t-transparent rounded-full animate-spin"></div>
                        <span>Processing query with Llama 3.2:3b & MedStreamMem...</span>
                      </div>
                    )}
                    
                    <div ref={chatEndRef} />
                  </div>

                  {/* Sample Query Toolbar */}
                  <div className="px-4 py-2 bg-slate-950/60 border-t border-slate-800 flex items-center gap-2 overflow-x-auto text-xs">
                    <span className="text-slate-400 font-semibold whitespace-nowrap">Try Query:</span>
                    {SAMPLE_QUERIES.map((sq, i) => (
                      <button 
                        key={i} 
                        onClick={() => handleSend(sq)} 
                        disabled={loading}
                        className="whitespace-nowrap px-2.5 py-1 bg-slate-800 hover:bg-teal-900/60 text-slate-300 hover:text-teal-200 border border-slate-700 hover:border-teal-700 rounded-lg text-[11px] transition">
                        {sq.substring(0, 35)}...
                      </button>
                    ))}
                  </div>

                  {/* Form Input */}
                  <form onSubmit={(e) => { e.preventDefault(); handleSend(); }} className="p-4 bg-slate-800 border-t border-slate-700 flex gap-3">
                    <input 
                      type="text" 
                      value={inputQuery} 
                      onChange={(e) => setInputQuery(e.target.value)} 
                      placeholder="Type your medical query or question here..." 
                      disabled={loading}
                      className="flex-1 bg-slate-900 border border-slate-700 focus:border-teal-500 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-teal-500 transition"
                    />
                    <button 
                      type="submit" 
                      disabled={loading || !inputQuery.trim()} 
                      className="px-5 py-3 bg-teal-600 hover:bg-teal-500 disabled:bg-slate-700 text-white font-medium rounded-xl text-sm transition shadow-md flex items-center gap-2">
                      <span>Send</span>
                      <span>➔</span>
                    </button>
                  </form>
                </div>

                {/* Right Side Telemetry Card */}
                <div className="w-full lg:w-96 bg-slate-800/90 p-4 border-l border-slate-700 overflow-y-auto space-y-4">
                  <div className="flex justify-between items-center">
                    <h2 className="font-bold text-slate-200 text-sm">🧠 Live MedStreamMem Buffer</h2>
                    <span className="text-xs bg-teal-950 text-teal-300 px-2 py-0.5 rounded border border-teal-800/80 font-mono">
                      {memoryData.entries ? memoryData.entries.length : 0} / {memoryData.capacity || 5} Items
                    </span>
                  </div>

                  <MemoryTableView entries={memoryData.entries || []} />
                  <EvictionFeedView evictions={memoryData.eviction_history || []} />
                </div>

              </div>
            )}

            {activeTab === 'memory' && (
              <div className="flex-1 p-6 overflow-y-auto bg-slate-900 space-y-6">
                <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
                  <h2 className="text-xl font-bold text-teal-400 mb-2">MedStreamMem Priority Telemetry</h2>
                  <MemoryTableView entries={memoryData.entries || []} expanded={true} />
                </div>

                <div className="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-lg">
                  <h2 className="text-lg font-bold text-rose-400 mb-3">Eviction History Log</h2>
                  <EvictionFeedView evictions={memoryData.eviction_history || []} expanded={true} />
                </div>
              </div>
            )}
          </div>

        </div>
      );
    }

    function MemoryTableView({ entries }) {
      if (!entries || entries.length === 0) {
        return (
          <div className="p-6 bg-slate-900/60 border border-slate-700/60 rounded-xl text-center text-slate-500 text-xs italic">
            Memory buffer is empty. Type a query in the chat to populate MedStreamMem.
          </div>
        );
      }

      return (
        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs text-slate-300 border-collapse">
            <thead className="bg-slate-900/90 text-slate-400 uppercase text-[10px] border-b border-slate-700">
              <tr>
                <th className="p-2">Rank</th>
                <th className="p-2">Query Key</th>
                <th className="p-2 text-center">&phi;<sub>hits</sub></th>
                <th className="p-2 text-center">&tau;<sub>trust</sub></th>
                <th className="p-2 text-center">&Delta;t</th>
                <th className="p-2 text-right">Priority</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-700/40 font-sans">
              {entries.map((item, idx) => (
                <tr key={idx} className="hover:bg-slate-700/40 transition">
                  <td className="p-2 font-mono font-bold text-teal-400">#{idx + 1}</td>
                  <td className="p-2 max-w-[140px] truncate text-slate-200" title={item.key}>{item.key}</td>
                  <td className="p-2 text-center font-mono font-bold text-teal-300">{item.hits}</td>
                  <td className="p-2 text-center font-mono text-amber-300">{item.trust}</td>
                  <td className="p-2 text-center font-mono text-sky-300">{item.delta_t}</td>
                  <td className="p-2 text-right font-mono font-bold text-emerald-400">{typeof item.priority_score === 'number' ? item.priority_score.toFixed(3) : item.priority_score}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    function EvictionFeedView({ evictions }) {
      if (!evictions || evictions.length === 0) {
        return (
          <div className="p-4 bg-slate-900/40 border border-slate-700/40 rounded-xl text-center text-slate-500 text-xs italic">
            No evictions recorded yet.
          </div>
        );
      }

      return (
        <div className="space-y-2 max-h-72 overflow-y-auto">
          {evictions.slice().reverse().map((ev, idx) => (
            <div key={idx} className="p-3 bg-rose-950/30 border border-rose-800/40 rounded-lg text-xs space-y-1">
              <div className="flex justify-between font-semibold text-rose-300">
                <span className="truncate max-w-[180px]" title={ev.evicted_key}>Evicted: {ev.evicted_key}</span>
                <span className="font-mono text-amber-300">Score: {ev.evicted_score}</span>
              </div>
              <div className="text-[11px] text-slate-400 flex justify-between font-mono">
                <span>&phi;<sub>hits</sub>: {ev.hits} | &tau;: {ev.trust} | &Delta;t: {ev.delta_t}</span>
                <span>Step: {ev.step}</span>
              </div>
            </div>
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
